name: Lighthouse

on:
  pull_request:
    branches: [main]

permissions:
  contents: write   # REQUIRED to push the results

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # allow pushing back to repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start Server
        run: |
          npm start &
          echo "Waiting for server to start..."
          sleep 2

      - name: Wait for Server Availability
        run: wait-on http://localhost:3000
        timeout-minutes: 2

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Lighthouse CLI
        run: npm install -g lighthouse

      - name: Run Lighthouse Audit
        run: |
          lighthouse http://localhost:3000 \
            --output html \
            --output-path ./lighthouse-report.html \
            --chrome-flags="--headless --no-sandbox --disable-gpu"

      - name: Upload Lighthouse Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.html

      - name: Save Lighthouse Report Into Repo
        if: github.event.pull_request.merged == false
        run: |
            BRANCH_NAME="${{ github.head_ref }}"
            echo "Switching to PR branch: $BRANCH_NAME"
  
            git fetch origin $BRANCH_NAME
            git checkout $BRANCH_NAME
  
            mkdir -p lighthouse-results
            cp lighthouse-report.html "lighthouse-results/lighthouse-results-${{ github.run_number }}.html"
  
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
  
            git add lighthouse-results/
            git commit -m "Add Lighthouse report #${{ github.run_number }}" || echo "No changes to commit"
            git push origin $BRANCH_NAME
  